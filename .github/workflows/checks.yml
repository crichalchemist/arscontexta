name: checks

on:
  push:
  pull_request:
  # Manual trigger. Without it the only way to re-run these gates is to push
  # another commit, which is exactly the wrong incentive when a gate is red and
  # the fix can only be validated on a runner (GNU vs BSD userland differences
  # are not reproducible on a maintainer's macOS machine).
  workflow_dispatch:

jobs:
  portability:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is REQUIRED by the placeholder gate below and is not a
      # preference. The default is depth 1, under which `git merge-base` cannot
      # resolve — and the naive guard (`git rev-parse --verify`) SUCCEEDS on a ref
      # whose history is absent, after which `git show "$base:$f"` returns empty,
      # every file reads as was=0, and `now >= 0` holds for all of them. That is a
      # silent PASS across the entire diff, in the DEFAULT configuration. The gate
      # exits 2 there instead, verified in a real depth-1 clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # jq and bc are used by fences in the SKILL.md corpus but are NOT in the
      # README prerequisite table, so nothing guarantees them on the runner
      # image. The fence-isolation gate asserts its tools are present and halts
      # loudly if they are not — installing them here keeps that assertion from
      # ever firing for an environment reason.
      - name: Install ripgrep, zsh, jq and bc
        run: sudo apt-get update && sudo apt-get install -y ripgrep zsh jq bc
      - name: Portability guard
        run: bash reference/check-portability.sh
      # Checks the CHECKOUT, not the packaged plugin -- see the script's banner,
      # which prints that distinction on every run precisely so a green tick here
      # is not read as the stronger §4 property it cannot verify.
      - name: Prose paths resolve (checkout only)
        run: bash reference/check-prose-paths.sh
      # Numbers our own documents STATE, checked against what the tree measures.
      # Declared claims only -- the script's banner prints that every run, because
      # a green tick here says nothing about numbers the claim table omits. Runs
      # under bash only by design: its suite totals are bash-run totals, and the
      # per-suite steps below are what cover the zsh side.
      #
      # This step is why the count claims it checks are edited in the same commit
      # that added it: adding a step changes the step count the gate reads. The
      # gate going red on its own introduction is the mechanism working.
      - name: Documented claims are current (bash)
        run: bash reference/check-doc-claims.sh
      # Did an edit HARDCODE a vault's vocabulary into a template? skill-sources/
      # files are copied into generated vaults, so a concrete `nodes/` where a
      # `{vocabulary.notes}` stood ships one user's dialect to every future system.
      # CONTRIBUTING.md called reversing this MANDATORY and nothing enforced it.
      #
      # It also fixes the manual check it replaces rather than merely automating
      # it: that check matched two placeholder families and missed {DOMAIN:*},
      # 128 markers across nine files. Hardcoding one produced no output at all.
      #
      # origin/main, not main: a CI checkout has no local main branch. On a push
      # to main the range is empty and the gate says so rather than passing mutely.
      - name: Templates did not lose placeholders (bash)
        run: bash reference/check-placeholder-count.sh origin/main
      # The gate above ships an EMPTY allowlist, so every branch behind it is
      # unexercised by any real run — the condition under which its first draft's
      # `set -- $e` bug survived review. These build real git repos, because the
      # subject is a git RANGE: both Criticals found in review (a two-dot range
      # blaming files the branch never touched; a rename laundering a hardcode)
      # are invisible to any test that does not construct history.
      - name: Placeholder gate behavior (bash)
        run: bash reference/test/placeholder-count.test.sh
      - name: Placeholder gate behavior (zsh)
        run: zsh reference/test/placeholder-count.test.sh
      - name: Shell syntax check
        run: |
          bash -n reference/validate-kernel.sh
          bash -n reference/check-portability.sh
          bash -n reference/lib/link-extraction.sh
      # Both harnesses run under BOTH shells. Two defects closed by this plan
      # were bash/zsh forks (unquoted array word-splitting, PIPESTATUS reading
      # empty under zsh); a bash-only run could not have seen either.
      - name: Behavioral tests (bash)
        run: bash reference/test/link-extraction.test.sh
      - name: Behavioral tests (zsh)
        run: zsh reference/test/link-extraction.test.sh
      - name: Guard failure-path tests (bash)
        run: bash reference/test/guard-failure.test.sh
      - name: Guard failure-path tests (zsh)
        run: zsh reference/test/guard-failure.test.sh
      # The kernel contract's own resolution logic. primitive 2 scanned a
      # hardcoded list of canonical directory names inside a validator for a
      # generator whose purpose is renaming them, so on every renamed vault the
      # dangling-link check silently never ran and printed WARN beside a PASS.
      # No other gate executes validate-kernel.sh at all.
      - name: Kernel note-dir resolution (bash)
        run: bash reference/test/kernel-note-dirs.test.sh
      - name: Kernel note-dir resolution (zsh)
        run: zsh reference/test/kernel-note-dirs.test.sh
      # The first coverage read_config.sh has ever had, and the guard on the one
      # namespace the self-evolution thresholds are read from. Two namespaces
      # declared the same two thresholds thirteen lines apart in one config file;
      # /rethink read one pair and /next, /remember and the SessionStart hook read
      # the other, so a vault's own tools disagreed about whether it was time to
      # run /rethink. No other gate reads a config key at all.
      - name: Threshold namespace (bash)
        run: bash reference/test/threshold-namespace.test.sh
      - name: Threshold namespace (zsh)
        run: zsh reference/test/threshold-namespace.test.sh
      # Executes every ```bash fence in every SKILL.md as its OWN shell
      # invocation, which is how Claude runs them. The three gates above cannot
      # see a fence reading a variable or sourced function defined in a
      # DIFFERENT fence: two match text and one exercises a library in
      # isolation, where it is correct. Four of the six blocking findings in the
      # whole-branch review were that defect.
      - name: Fence isolation (bash)
        run: bash reference/test/fence-isolation.test.sh
      - name: Fence isolation (zsh)
        run: zsh reference/test/fence-isolation.test.sh

      # The manifests must agree with each other on every push, not only at
      # release time. A published plugin and this tree once both claimed the
      # same version while differing materially, which made the version
      # string useless for telling two artifacts apart. The script this was
      # ported from is a manual release tool in a repo with no CI at all —
      # precisely how a stale version survives.
      #
      # --check, not --audit: --check asserts the declared manifests agree, which
      # is a machine-checkable invariant. --audit scans prose for a stale string
      # and needs a human to judge each hit, so it stays a release-time tool.
      - name: Version manifests agree
        run: bash scripts/bump-version.sh --check

      # --check above proves the manifests agree TODAY; it says nothing about what
      # the script does when they do not. These exercise the failure paths against
      # a fixture tree — MISSING rows, jq's "null" at exit 0, an unanchored version
      # argument, an unreadable directory during the audit — and pin the $path/zsh
      # fork that shipped because only the bash form was ever run.
      - name: Version tool failure-path tests (bash)
        run: bash reference/test/bump-version.test.sh
      - name: Version tool failure-path tests (zsh)
        run: zsh reference/test/bump-version.test.sh
