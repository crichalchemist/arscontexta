# Vale config for this vault. Vale walks up from the working directory and uses
# the first .vale.ini it finds, so this file fully REPLACES the global config at
# ~/Library/Application Support/vale/.vale.ini. The two do not merge.

# styles/ here is a real copy of Slop and STE, not a symlink into the
# vale-llm-slop repo, so the vault lints even if that repo moves or is deleted.
# Refresh after editing a rule there:  cp -R <repo>/styles/Slop styles/Slop
StylesPath = styles

# Half the Slop rules are suggestion-level; `warning` silences 8 of 16.
MinAlertLevel = suggestion

# Notes, specs, captures, agent output.
# README.md is deliberately NOT excluded — it lints like any other file.
[*.md]
BasedOnStyles = Slop

# Prose inside scripts and workers: docstrings and comments.
[*.{py,sh}]
BasedOnStyles = Slop

# STE enforces ASD-STE100 — sentence length, passive voice, gerunds,
# contractions. Right for procedures, punishing for notes. Uncomment both lines
# to enable; Vale is last-match-wins, so this overrides the [*.md] block above.
# [*.md]
# BasedOnStyles = Slop, STE
